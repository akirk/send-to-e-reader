name: Playground link

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  delete:

permissions:
  contents: read

concurrency:
  group: playground-link-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.ref }}
  cancel-in-progress: true

jobs:
  update-pr-description:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add Playground link to PR description
        uses: actions/github-script@v9
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const markerStart = '<!-- playground-link:start -->';
            const markerEnd = '<!-- playground-link:end -->';
            const markerPattern = /<!-- (?:[a-z0-9-]+-)?playground-link:start -->[\s\S]*?<!-- (?:[a-z0-9-]+-)?playground-link:end -->/;
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;

            // The plugin bundles Composer dependencies, so Playground installs
            // from the built dist branch rather than from the source branch.
            const distRef = `dist/${process.env.HEAD_REF}`;
            const blueprintUrl = `https://raw.githubusercontent.com/${owner}/${repo}/refs/heads/${distRef}/blueprint.json`;
            const playgroundUrl = `https://playground.wordpress.net/?blueprint-url=${blueprintUrl}`;

            const playgroundSection = [
              markerStart,
              '## WordPress Playground',
              '',
              `[**Test this pull request in WordPress Playground**](${playgroundUrl})`,
              '',
              'The demo boots a throwaway WordPress with this branch installed, a handful of posts, and two e-readers configured, so the *Send to E-Reader* row and bulk actions on the Posts screen work straight away.',
              '',
              `<sub>Built from the <code>${distRef}</code> branch, including Composer dependencies. This section disappears when the branch is deleted.</sub>`,
              markerEnd,
            ].join('\n');

            const currentBody = context.payload.pull_request.body || '';
            const body = markerPattern.test(currentBody)
              ? currentBody.replace(markerPattern, playgroundSection)
              : [currentBody.trimEnd(), playgroundSection].filter(Boolean).join('\n\n');

            if (body !== currentBody) {
              await github.rest.pulls.update({ owner, repo, pull_number, body });
            }

  remove-stale-pr-links:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && !startsWith(github.event.ref, 'dist/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the Playground link from PR descriptions
        uses: actions/github-script@v9
        env:
          BRANCH_NAME: ${{ github.event.ref }}
        with:
          script: |
            const markerPattern = /<!-- (?:[a-z0-9-]+-)?playground-link:start -->[\s\S]*?<!-- (?:[a-z0-9-]+-)?playground-link:end -->/;
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'all',
              head: `${owner}:${process.env.BRANCH_NAME}`,
              per_page: 100,
            });

            for (const pull of pulls) {
              const currentBody = pull.body || '';
              if (!markerPattern.test(currentBody)) {
                continue;
              }

              const body = currentBody
                .replace(markerPattern, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();

              await github.rest.pulls.update({ owner, repo, pull_number: pull.number, body });
            }
